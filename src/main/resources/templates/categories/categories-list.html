<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý danh mục</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">

    <nav>
        <a th:href="@{/categories}">Danh mục</a>
        <a th:href="@{/products}">Sản phẩm</a>
    </nav>

    <h1>Quản lý danh mục</h1>

    <div class="success"
         th:if="${success}"
         th:text="${success}"></div>

    <div class="error"
         th:if="${error}"
         th:text="${error}"></div>

    <div class="toolbar">
        <a class="btn" th:href="@{/categories/add}">
            + Thêm danh mục
        </a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên danh mục</th>
                <th>Thao tác</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="3">Chưa có danh mục.</td>
            </tr>

            <tr th:each="category : ${categories}">
                <td th:text="${category.id}"></td>
                <td th:text="${category.name}"></td>

                <td class="actions">
                    <a class="btn btn-edit"
                       th:href="@{/categories/edit/{id}(id=${category.id})}">
                        Sửa
                    </a>

                    <form method="post"
                          th:action="@{/categories/delete/{id}(id=${category.id})}"
                          onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">

                        <button type="submit" class="btn btn-delete">
                            Xóa
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
